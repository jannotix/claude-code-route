name: comment-voice
description: Comments carry what the code cannot, in English, and nothing else.
runs: 3
max_turns: 20
timeout_seconds: 700
tags: [voice]
scaffold_script: |
  mkdir -p src/gateway
  cat > src/gateway/__init__.py <<'PY'
  PY
graders:
  - file: graders/no-narration.md
  - file: graders/carries-the-why.md
