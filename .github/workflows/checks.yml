name: checks

on:
  # Every push, not only main: NFR-002 asks for the install proof on every push, and a branch
  # or tag push without a pull request ran nothing. Found by the seventh adversarial round.
  push:
  pull_request:

# Every job, not only the ones that pipe today. GitHub's default is `bash -e` with no pipefail, so
# a step ending in a pipe reports the last command's status and a failing one passes the build. That
# masked the installed-suite check in 1.1.0. Setting it here means a future step cannot regress into
# it. (REQ-006)
defaults:
  run:
    shell: bash

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse
        run: |
          for f in skills/claude-code-route/scripts/*.mjs; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))"

      - name: Manifest version matches the changelog, and nothing ships unversioned
        run: |
          v=$(node -p "require('./.claude-plugin/plugin.json').version")
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }
          node .github/changelog-gate.mjs CHANGELOG.md

      - name: Skill frontmatter
        run: |
          node -e '
            const t = require("fs").readFileSync("skills/claude-code-route/SKILL.md", "utf8");
            const m = t.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!m) { console.error("SKILL.md has no frontmatter"); process.exit(1); }
            for (const k of ["name", "description", "license"]) {
              if (!new RegExp("^" + k + ":", "m").test(m[1])) { console.error("missing " + k); process.exit(1); }
            }
          '

      - name: Internal links resolve
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const base = "skills/claude-code-route";
            let bad = [];
            const scan = (file, dir) => {
              for (const m of fs.readFileSync(file, "utf8").matchAll(/\]\(([^)#:]+\.md)\)/g)) {
                const p = path.join(dir, m[1]);
                if (!fs.existsSync(p)) bad.push(file + " -> " + m[1]);
              }
            };
            scan(base + "/SKILL.md", base);
            for (const f of fs.readdirSync(base + "/references")) scan(base + "/references/" + f, base + "/references");
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
          '


      - name: Eval suite is well formed
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = "evals";
            const manifest = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            let bad = [];
            if (manifest.experimental?.evals !== dir) bad.push("manifest does not declare " + dir);
            const cases = fs.readdirSync(dir, { withFileTypes: true }).filter(e => e.isDirectory());
            if (cases.length < 3) bad.push("fewer than three cases");
            for (const c of cases) {
              const d = path.join(dir, c.name);
              const y = path.join(d, "case.yaml");
              if (!fs.existsSync(y)) { bad.push(d + ": no case.yaml"); continue; }
              if (!fs.existsSync(path.join(d, "prompt.md"))) bad.push(d + ": no prompt.md");
              const yaml = fs.readFileSync(y, "utf8");
              const name = (yaml.match(/^name:\s*(\S+)\s*$/m) || [])[1];
              if (name !== c.name) bad.push(d + ": name is " + name);
              const refs = [...yaml.matchAll(/^\s*-\s*file:\s*(\S+)\s*$/gm)].map(m => m[1]);
              if (refs.length < 2) bad.push(d + ": fewer than two graders");
              for (const r of refs) if (!fs.existsSync(path.join(d, r))) bad.push(d + " -> " + r);
              const gdir = path.join(d, "graders");
              if (fs.existsSync(gdir)) {
                for (const g of fs.readdirSync(gdir)) {
                  if (!refs.includes("graders/" + g)) bad.push(d + ": unreferenced " + g);
                }
              }
            }
            if (bad.length) { for (const b of bad) console.error(b); process.exit(1); }
            console.log("eval suite: " + cases.length + " cases, all references resolve");
          '

      - name: Every published directory states its purpose
        run: node .github/published-dirs.mjs .

      - name: Every eval scaffold is runnable bash
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), cp = require("child_process");
            const NL = String.fromCharCode(10);
            let bad = [];
            for (const c of fs.readdirSync("evals", { withFileTypes: true })) {
              if (!c.isDirectory()) continue;
              const y = fs.readFileSync(path.join("evals", c.name, "case.yaml"), "utf8");
              const lines = y.split(NL);
              const i = lines.findIndex(l => l.trim() === "scaffold_script: |");
              if (i === -1) { bad.push(c.name + ": no scaffold_script"); continue; }
              const body = [];
              for (const l of lines.slice(i + 1)) {
                if (l.trim() !== "" && !l.startsWith("  ")) break;
                body.push(l.startsWith("  ") ? l.slice(2) : l);
              }
              if (body.join("").trim() === "") { bad.push(c.name + ": empty scaffold_script"); continue; }
              const r = cp.spawnSync("bash", ["-n"], { input: body.join(NL) });
              if (r.status !== 0) bad.push(c.name + ": " + String(r.stderr).trim());
              else console.log(c.name + ": scaffold parses");
            }
            if (bad.length) { for (const b of bad) console.error(b); process.exit(1); }
          '



  suite:
    name: suite (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18.0.0', 18, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: The test suite passes, from three working directories
        run: |
          for d in . skills evals; do
            (cd "$d" && node "$GITHUB_WORKSPACE/tests/route-lint.test.mjs" | tail -1)
          done

      - name: route-map runs on this repository
        run: node skills/claude-code-route/scripts/route-map.mjs . --json > /dev/null

      - name: route-history appends, chains and detects an edit
        run: |
          set -e
          H=skills/claude-code-route/scripts/route-history.mjs
          L=$(mktemp)
          node $H append --file "$L" --event cycle.planned --model ci --operator ci --ts 2026-01-01T00:00:00+00:00
          node $H append --file "$L" --event cycle.reviewed --model ci --operator ci --ts 2026-01-01T00:01:00+00:00 --verdict delivered
          node $H verify --file "$L"
          node -e 'const fs=require("fs"),f=process.argv[1];fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace("delivered","blocked"))' "$L"
          if node $H verify --file "$L"; then echo "verify failed to detect an edited entry"; exit 1; fi

      - name: route-lint rejects a plan that closes on a read
        run: |
          set -e
          D=$(mktemp -d)
          cat > "$D/PLAN.md" <<'PLAN'
          # Sample

          Depth: Standard

          ## Request

          A sample request.

          ## Requirements

          REQ-001  A thing must happen.
            AC-001.1  Given a When b Then c

          ## Placement

          | REQ | Rule | Home | Layer |
          | --- | --- | --- | --- |
          | REQ-001 | the rule | `Thing.doIt` | domain |

          ## Scope

          src/

          ## Out of scope

          - Everything else.

          ## Proof

          | Requirement | Proof | Result |
          | --- | --- | --- |
          | REQ-001 | verified by inspection | pass |
          PLAN
          if node skills/claude-code-route/scripts/route-lint.mjs "$D"; then
            echo "lint accepted a proof that was never executed"; exit 1
          fi

  install:
    name: install the candidate and run the installed suite
    runs-on: ${{ matrix.os }}
    # NFR-002 asks for an install proof cheap enough to always run, and the budget is 300 seconds.
    # Round 12: a proof row that printed the durations asserted nothing about them, and the same
    # command shape exited 0 against a job of 361 seconds. Here the budget fails the job.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Round 12: this job used to add the marketplace from GitHub, which serves the default branch.
      # On a branch push that installed some other commit, so the proof measured whatever main held
      # rather than the candidate. `marketplace add` takes a path, so the candidate installs itself.
      - name: Install the candidate from this checkout
        run: |
          claude plugin marketplace add "$PWD"
          claude plugin install claude-code-route

      - name: The installed copy is this commit
        if: runner.os == 'Linux'
        run: |
          suite=$(find "$HOME/.claude/plugins/cache" -type f -name route-lint.test.mjs | head -1)
          test -n "$suite" || { echo "no installed copy found"; exit 1; }
          root=$(dirname "$(dirname "$suite")")
          compared=0
          differ=0
          while IFS= read -r f; do
            rel=${f#"$root"/}
            compared=$((compared + 1))
            if ! git cat-file -e "$GITHUB_SHA:$rel" 2>/dev/null; then
              echo "installed but not in this commit: $rel"
              differ=1
              continue
            fi
            if [ "$(git hash-object "$f")" != "$(git rev-parse "$GITHUB_SHA:$rel")" ]; then
              echo "differs from this commit: $rel"
              differ=1
            fi
          done < <(find "$root" -type f -not -path '*/.git/*')
          tracked=0
          while IFS= read -r rel; do
            tracked=$((tracked + 1))
            if [ ! -f "$root/$rel" ]; then
              echo "in this commit but not installed: $rel"
              differ=1
            fi
          done < <(git ls-tree -r --name-only "$GITHUB_SHA")
          echo "compared $compared installed files against $tracked tracked at $GITHUB_SHA"
          # A walk that finds nothing leaves differ at 0, which is how a comparison passes without
          # comparing. The floor catches an empty walk on either side, not a count.
          test "$compared" -ge 20 || { echo "walked too few installed files to prove anything"; exit 1; }
          test "$tracked" -ge 20 || { echo "walked too few tracked files to prove anything"; exit 1; }
          test "$differ" -eq 0 || { echo "the installed copy is not this commit"; exit 1; }

      - name: Claude Code loads the plugin it installed
        run: |
          want=$(node -p "require('./.claude-plugin/plugin.json').version")
          claude plugin details claude-code-route > details.txt || { cat details.txt; exit 1; }
          cat details.txt
          # Files landing on disk is not the plugin working. This is the CLI resolving the manifest,
          # reporting the version this commit declares, and listing the skill as loadable.
          # Round 11: unanchored, these accepted `claude-code-route-extra`, `1x1x2` and `1.1.20`.
          # -x matches the whole line and -F takes the pattern literally, so a dot is a dot.
          grep -qxF "  Skills (1)  claude-code-route" details.txt || { echo "the CLI does not list exactly the skill this plugin ships"; exit 1; }
          grep -qxF "Claude Code Route (claude-code-route) $want" details.txt || { echo "the CLI reports a version that is not $want"; exit 1; }
          rm details.txt

      - name: The installed copy runs its own suite
        run: |
          suite=$(find "$HOME/.claude/plugins/cache" -type f -name route-lint.test.mjs | head -1)
          test -n "$suite" || { echo "the installed copy carries no test suite"; exit 1; }
          echo "found: $suite"
          cd "$(dirname "$(dirname "$suite")")" && node tests/route-lint.test.mjs | tail -1

      # Installing the candidate proves the artifact; it does not prove the channel users take.
      # That one only means anything where the marketplace serves this commit, which is main.
      - name: The marketplace serves this commit
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          want=$(node -p "require('./.claude-plugin/plugin.json').version")
          claude plugin marketplace remove claude-code-route
          claude plugin marketplace add "$GITHUB_REPOSITORY"
          claude plugin install claude-code-route
          claude plugin details claude-code-route > channel.txt || { cat channel.txt; exit 1; }
          cat channel.txt
          grep -qxF "Claude Code Route (claude-code-route) $want" channel.txt || { echo "the marketplace serves a version that is not $want"; exit 1; }
          rm channel.txt
